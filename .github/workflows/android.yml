name: Android Production Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Secure Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clean Workspace and Create Fresh Project
        run: |
          mkdir -p secure-build-env
          cd secure-build-env
          
          # 1. Xavfsiz paketlar zanjiri
          echo '{"name":"managed-security","version":"1.0.0","main":"node_modules/expo/AppEntry.js","scripts":{"android":"expo run:android"},"dependencies":{"expo":"~51.0.3","react-native":"0.74.1","expo-build-properties":"~0.12.1","expo-secure-store":"~13.0.1"},"devDependencies":{"@babel/core":"^7.20.0","babel-preset-expo":"~11.0.0"}}' > package.json
          
          # 2. Splash background va xavfsizlik sozlamalari bilan app.json konfiguratsiyasi
          echo '{"expo":{"name":"Managed Security","slug":"managed-security","version":"1.0.0","orientation":"portrait","jsEngine":"hermes","splash":{"backgroundColor":"#ffffff"},"android":{"package":"com.managedsecurity.app"},"plugins":[["expo-build-properties",{"android":{"enableProguardInReleaseBuilds":true,"usesCleartextTraffic":false}}]]}}' > app.json
          
          # 3. Babel va Metro sozlamalari
          echo "module.exports = function(api) { api.cache(true); return { presets: ['babel-preset-expo'] }; };" > babel.config.js
          echo "const { getDefaultConfig } = require('expo/metro-config'); const config = getDefaultConfig(__dirname); module.exports = config;" > metro.config.js
          
          # 4. Asosiy kod
          echo "import { Text, View } from 'react-native'; export default function App() { return <View style={{flex:1,justifyContent:'center',alignItems:'center',backgroundColor:'#ffffff'}}><Text>Secure App Initialized</Text></View>; }" > App.tsx

      - name: Install Secure Dependencies
        run: |
          cd secure-build-env
          npm install

      - name: Prebuild Expo to Android Native
        run: |
          cd secure-build-env
          npx expo prebuild --platform android --no-install

      - name: Grant Execute Permission for Gradle
        run: |
          cd secure-build-env
          chmod +x android/gradlew

      - name: Build Production Release APK with R8 Obfuscation
        run: |
          cd secure-build-env/android
          ./gradlew assembleRelease

      - name: Upload Secure Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: managed-security-release-apk
          path: |
            **/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

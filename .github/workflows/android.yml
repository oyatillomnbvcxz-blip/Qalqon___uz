name: Android Production Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Secure Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Initialize Clean Secure Expo App
        run: |
          # Agar package.json bo'lsa o'chiramiz va eng toza Expo loyihasini noldan tiklaymiz
          rm -f package.json app.json babel.config.js index.js
          
          # Yangi, xavfsiz va minimal loyiha strukturasini yaratish
          echo '{"name":"managed-security","version":"1.0.0","scripts":{"android":"expo run:android"},"dependencies":{"expo":"~51.0.3","react-native":"0.74.1","expo-router":"~3.5.1","expo-build-properties":"~0.12.1","expo-secure-store":"~13.0.1","react-native-safe-area-context":"4.10.1","react-native-screens":"~3.31.1"},"devDependencies":{"@babel/core":"^7.20.0","babel-preset-expo":"~11.0.0"}}' > package.json
          
          # Google Play talablariga mos app.json (Rasmlarsiz, xatolik bermasligi uchun)
          echo '{"expo":{"name":"Managed Security","slug":"managed-security","version":"1.0.0","orientation":"portrait","jsEngine":"hermes","android":{"package":"com.managedsecurity.app"},"plugins":[["expo-build-properties",{"android":{"enableProguardInReleaseBuilds":true,"usesCleartextTraffic":false}}]]}}' > app.json
          
          # Minimal Babel konfiguratsiyasi
          echo "module.exports = function(api) { api.cache(true); return { presets: ['babel-preset-expo'], plugins: ['expo-router/babel'] }; };" > babel.config.js
          
          # Expo Router uchun kirish papkasini majburiy tiklash
          mkdir -p app
          echo "import { Text, View } from 'react-native'; export default function Page() { return <View><Text>Secure App Initialized</Text></View>; }" > app/index.tsx

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Expo to Android Native
        run: npx expo prebuild --platform android --no-install

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Production Release APK with R8 Obfuscation
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Secure Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: managed-security-release-apk
          path: |
            **/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

name: Android Production Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Secure Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Force Create Secure Expo App Files
        run: |
          # 1. Package.json yaratish
          if [ ! -f "package.json" ]; then
            echo '{"name":"managed-security","version":"1.0.0","main":"index.js","scripts":{"android":"expo run:android"},"dependencies":{"expo":"~51.0.0","react-native":"0.74.1"},"devDependencies":{"@babel/core":"^7.20.0","babel-preset-expo":"~11.0.0"}}' > package.json
          fi
          
          # 2. App.json yaratish (Xavfsizlik sozlamalari bilan)
          if [ ! -f "app.json" ]; then
            echo '{"expo":{"name":"Managed Security","slug":"managed-security","version":"1.0.0","orientation":"portrait","jsEngine":"hermes","android":{"package":"com.managedsecurity.app"},"plugins":[["expo-build-properties",{"android":{"enableProguardInReleaseBuilds":true,"usesCleartextTraffic":false}}]]}}' > app.json
          fi

          # 3. Kirish fayli (index.js) yaratish - Bundler adashmasligi uchun
          if [ ! -f "index.js" ]; then
            echo "import { registerRootComponent } from 'expo'; import App from './app/_layout'; registerRootComponent(App);" > index.js
          fi

          # 4. Babel konfiguratsiyasini yaratish (Bundle xatosini yo'qotadi)
          if [ ! -f "babel.config.js" ]; then
            echo "module.exports = function(api) { api.cache(true); return { presets: ['babel-preset-expo'] }; };" > babel.config.js
          fi

      - name: Install Base Dependencies
        run: npm install

      - name: Install Secure Expo Modules Automatically
        run: npx expo install expo-build-properties expo-secure-store -- --no-audit

      - name: Prebuild Expo to Android Native
        run: npx expo prebuild --platform android --no-install

      - name: Finalize Project Dependencies
        run: npm install

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Production Release APK with R8 Obfuscation
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Secure Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: managed-security-release-apk
          path: |
            **/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
